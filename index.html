<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's Who in Mirabilis — HERO Guild Field Compendium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #8b6914;
  --accent-mid: #b08830;
  --accent-light:#d4aa55;
  --accent-dim: #5c4710;
  --text: #2c2c2c;
  --text-soft: #5a4a2a;
  --bg: #f0e8d6;
  --card-bg: #fdf7ec;
  --card-hover: #fff9f0;
  --border: #c8a85a;
  --border-soft: #dfc990;
  --shadow: rgba(90,60,10,0.13);
  --tag-guild: #2c4a1e;
  --tag-guild-bg:#d6e8c6;
  --tag-loc: #3a1e4a;
  --tag-loc-bg: #ddc6e8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Caudex', serif;
  background-color: var(--bg);
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 28px,
    rgba(139,105,20,0.04) 28px, rgba(139,105,20,0.04) 29px
  );
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: linear-gradient(160deg, var(--accent-dim) 0%, var(--accent) 60%, var(--accent-mid) 100%);
  color: #fdf7ec;
  text-align: center;
  padding: 2.5rem 1.5rem 2rem;
  position: relative; overflow: hidden;
  border-bottom: 3px solid var(--accent-dim);
}
header::before {
  content: ''; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}
.header-ornament {
  font-size: 1.1rem; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--accent-light);
  margin-bottom: 0.5rem; font-style: italic;
}
header h1 {
  font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700;
  letter-spacing: 0.03em; line-height: 1.1;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.header-sub {
  margin-top: 0.6rem; font-style: italic;
  color: rgba(253,247,236,0.75); font-size: 1rem;
}
.header-rule {
  width: 120px; height: 2px; background: var(--accent-light);
  margin: 1rem auto 0; border-radius: 2px; opacity: 0.6;
}

/* ── SEARCH ── */
.search-wrap { max-width: 680px; margin: 2rem auto 0.5rem; padding: 0 1.5rem; }
.search-inner { position: relative; display: flex; align-items: center; }
.search-icon {
  position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--accent); pointer-events: none;
}
#search {
  width: 100%; padding: 0.85rem 1rem 0.85rem 3rem;
  font-family: 'Caudex', serif; font-size: 1rem;
  border: 2px solid var(--border); border-radius: 8px;
  background: var(--card-bg); color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,105,20,0.15); }
#search::placeholder { color: #a08840; font-style: italic; }

.results-bar {
  max-width: 1320px; margin: 0.75rem auto 0; padding: 0 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 0.5rem;
}
#count { font-size: 0.85rem; color: var(--text-soft); font-style: italic; }

/* ── TAGS ── */
.tag {
  display: inline-block; font-size: 0.68rem; font-family: 'Caudex', serif;
  padding: 0.15em 0.6em; border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.04em; font-weight: 700; white-space: nowrap;
}
.tag-guild { background: var(--tag-guild-bg); color: var(--tag-guild); border: 1px solid #a8c898; }
.tag-loc   { background: var(--tag-loc-bg);   color: var(--tag-loc);   border: 1px solid #c098d4; }

/* ── GRID ── */
.npc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
  padding: 1.5rem 1.5rem 3rem;
  max-width: 1320px; margin: 0 auto;
}

/* ── CARD ── */
.npc-card {
  background: var(--card-bg);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 10px var(--shadow);
  display: flex; flex-direction: column;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.npc-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(90,60,10,0.2);
  border-color: var(--border);
}

.card-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
}
.card-image img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: top center;
  display: block;
  transition: transform 0.25s ease;
}
.card-image:hover img { transform: scale(1.04); }

.card-image-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 4rem; font-weight: 700; color: rgba(255,255,255,0.9);
  text-shadow: 0 2px 8px rgba(0,0,0,0.35);
  letter-spacing: 0.05em;
}

.card-image::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 4px;
  background: var(--accent-mid);
}

/* Zoom hint on hover */
.card-image::before {
  content: '⤢';
  position: absolute; top: 0.5rem; right: 0.6rem;
  font-size: 1.1rem; color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 1;
  pointer-events: none;
}
.card-image:hover::before { opacity: 1; }

.card-body {
  padding: 0.9rem 1rem 1rem;
  display: flex; flex-direction: column; gap: 0.4rem;
  flex: 1;
}
.npc-name {
  font-size: 1.15rem; font-weight: 700;
  color: var(--accent-dim); line-height: 1.2;
}
.npc-subtitle {
  font-size: 0.95rem; color: var(--text-soft);
  font-style: italic; line-height: 1.35;
}
.card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.1rem; }
.card-desc {
  margin-top: 0.5rem; font-size: 0.95rem;
  color: var(--text); line-height: 1.65;
  border-top: 1px solid var(--border-soft);
  padding-top: 0.6rem;
}

/* ── ALPHA DIVIDERS ── */
.alpha-divider-wrap { display: contents; }
.alpha-divider {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 1rem;
  margin: 0.4rem 0 -0.2rem;
}
.alpha-divider span {
  font-size: 1.4rem; font-weight: 700;
  color: var(--accent); flex-shrink: 0; line-height: 1;
}
.alpha-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-soft); }

/* ── EMPTY STATE ── */
.empty-state {
  grid-column: 1 / -1; text-align: center;
  padding: 4rem 2rem; color: var(--text-soft);
}
.empty-state h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
.empty-state p  { font-style: italic; font-size: 0.95rem; line-height: 1.6; }
.empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }

/* ── IMAGE MODAL ── */
.modal-backdrop {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(20, 12, 4, 0.88);
  backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
  padding: 1.5rem;
  cursor: pointer;
}
.modal-backdrop.open { display: flex; }

.modal-content {
  position: relative;
  max-width: min(88vw, 680px);
  max-height: 92vh;
  display: flex; flex-direction: column; align-items: center;
  gap: 1rem;
  cursor: default;
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
.modal-content img {
  max-width: 100%;
  max-height: 78vh;
  object-fit: contain;
  border-radius: 8px;
  border: 3px solid var(--accent-mid);
  box-shadow: 0 12px 48px rgba(0,0,0,0.6);
  display: block;
}
.modal-name {
  font-family: 'Caudex', serif;
  font-size: 1.3rem; font-weight: 700;
  color: var(--accent-light);
  text-align: center;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}
.modal-close {
  position: absolute; top: -0.75rem; right: -0.75rem;
  width: 2rem; height: 2rem; border-radius: 50%;
  background: var(--accent-mid); border: 2px solid var(--accent-light);
  color: #fff; font-size: 1rem; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-family: sans-serif;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: background 0.15s;
}
.modal-close:hover { background: var(--accent-dim); }

footer {
  text-align: center; padding: 1.5rem;
  font-style: italic; font-size: 0.85rem;
  color: var(--text-soft); border-top: 1px solid var(--border-soft);
}

@media (max-width: 480px) {
  .npc-grid { grid-template-columns: 1fr; padding: 1rem; gap: 1rem; }
  header { padding: 1.8rem 1rem 1.5rem; }
}

@media (min-width: 1200px) {
  .npc-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<header>
  <div class="header-ornament">HERO Guild · Mirabilis</div>
  <h1>Who's Who in Mirabilis</h1>
  <p class="header-sub">Field Compendium of Notable Persons &amp; Persons of Note</p>
  <div class="header-rule"></div>

<div class="search-wrap">
  <div class="search-inner">

  </div>
</div>

<footer>
  <em>"Someone has to do it. Statistically, that someone is you."</em>
  &nbsp;—&nbsp; Aldric Fumblestaff, INTERNS Liaison Officer
</footer>

// ── AVATAR COLOURS ──
const PALETTE = [
  ["#5c3d2e","#a0522d"],["#1e3a5f","#2e6da4"],["#2d4a1e","#4a7c3f"],
  ["#4a2a5c","#7a4a9c"],["#5c2a1e","#9c4a3e"],["#1e4a4a","#3e8a8a"],
  ["#3a3a1e","#6a6a2e"],["#4a1e3a","#8a3a6a"],["#1e2d4a","#3e5a8a"],
  ["#3d2a1e","#7a5a3e"],["#2a4a2a","#5a8a5a"],["#4a3a1e","#8a6a3e"],
];
function avatarColors(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function initials(name) {
  const parts = name.replace(/['"()]/g, '').split(/[\s&]+/).filter(Boolean);
  return parts.length >= 2
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : name.slice(0, 2).toUpperCase();
}

// ── MODAL ──
const backdrop = document.getElementById('modalBackdrop');
const modalImg  = document.getElementById('modalImg');
const modalName = document.getElementById('modalName');

function openModal(src, name) {
  modalImg.src  = src;
  modalImg.alt  = name;
  modalName.textContent = name;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { modalImg.src = ''; }, 200);
}

document.getElementById('modalClose').addEventListener('click', e => {
  e.stopPropagation(); closeModal();
});
backdrop.addEventListener('click', e => {
  if (e.target === backdrop) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── RENDER ──
const grid   = document.getElementById('npcGrid');
const search = document.getElementById('search');
const count  = document.getElementById('count');

const MET = NPC_DATA
  .filter(n => n.metByPlayers)
  .sort((a, b) => a.name.localeCompare(b.name));

MET.forEach(n => {
  n._search = [n.name, n.subtitle, n.role, n.location, n.description]
    .join(' ').toLowerCase();
});

function buildCard(npc) {
  const [dark, mid] = avatarColors(npc.name);
  const inits = initials(npc.name);
  const placeholder = 'linear-gradient(160deg,#4a2a5c,#7a4a9c)';

  const tags = [];
  if (npc.guildMember) tags.push(`<span class="tag tag-guild">Guild Member</span>`);
  if (npc.location)    tags.push(`<span class="tag tag-loc">${npc.location}</span>`);

  let imageHtml;
  if (npc.image) {
    imageHtml = `
      <div class="card-image" data-src="${npc.image}" data-name="${npc.name}">
        <img src="${npc.image}" alt="${npc.name}"
          onerror="var p=this.parentNode; p.style.background='${placeholder}'; p.removeAttribute('data-src'); p.innerHTML='<div class=\\'card-image-placeholder\\'>${inits}</div>';">
      </div>`;
  } else {
    imageHtml = `
      <div class="card-image" style="background:${placeholder}">
        <div class="card-image-placeholder">${inits}</div>
      </div>`;
  }

  const subtitleLine = [npc.role].filter(Boolean).join(' · ');
  const descBlock    = npc.description
    ? `<div class="card-desc">${npc.description}</div>` : '';

  return `
  <div class="npc-card">
    ${imageHtml}
    <div class="card-body">
      <div class="npc-name">${npc.name}</div>
      ${subtitleLine ? `<div class="npc-subtitle">${subtitleLine}</div>` : ''}
      <div class="card-tags">${tags.join('')}</div>
      ${descBlock}
    </div>
  </div>`;
}

// Delegate click handling for card images
grid.addEventListener('click', e => {
  const img = e.target.closest('.card-image[data-src]');
  if (img) openModal(img.dataset.src, img.dataset.name);
});

function render(query) {
  const q = query.toLowerCase().trim();
  grid.innerHTML = '';
  const visible = q ? MET.filter(n => n._search.includes(q)) : MET;

  if (MET.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📜</div>
        <h3>No introductions on record yet.</h3>
        <p>The ledger is empty — but not for long.<br>
           Characters will appear here as the party encounters them.</p>
      </div>`;
    count.textContent = ''; return;
  }
  if (visible.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No one found.</h3>
        <p>Try a different name or location —<br>they may be using an alias.</p>
      </div>`;
    count.textContent = 'No results.'; return;
  }

  let lastLetter = '';
  visible.forEach(npc => {
    const letter = npc.name[0].toUpperCase();
    // if (!q && letter !== lastLetter) {
    //   grid.insertAdjacentHTML('beforeend',
    //     `<div class="alpha-divider-wrap"><div class="alpha-divider"><span>${letter}</span></div></div>`);
    //   lastLetter = letter;
    // }
    grid.insertAdjacentHTML('beforeend', buildCard(npc));
  });

  const total = MET.length;
  count.textContent = q
    ? `${visible.length} of ${total} character${total !== 1 ? 's' : ''}`
    : `${total} character${total !== 1 ? 's' : ''} encountered so far`;
}

search.addEventListener('input', e => render(e.target.value));
render('');
